<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>grand-octave: lit original</title>
  <style>
    :root {
      --ivory: #e8e1d1;
      --ivory-dim: #9b948a;
      --brass: #c9a35a;
      --brass-deep: #8a6d33;
      --font-display: Georgia, "Times New Roman", serif;
      --font-utility: ui-monospace, "SF Mono", Menlo, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, #23222a, #121116 55%, #0a090c);
      font-family: var(--font-utility);
    }
    main { width: min(680px, 92vw); }
    h1 {
      margin: 0 0 0.4rem;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--ivory);
    }
    h1 small { color: var(--ivory-dim); font-size: 0.7em; }
    .compare { margin-top: 1rem; font-size: 0.75rem; font-family: var(--font-utility); }
    .compare a { color: var(--brass); }
  </style>
</head>
<body>
  <main>
    <h1>grand-octave <small>: the lit-html original</small></h1>
    <grand-octave></grand-octave>
    <p class="compare">watch the render() counter climb with every note, then <a href="./">← back to the render-once version</a></p>
  </main>
  <script type="module">
    import { LitElement, css, html, nothing } from "https://esm.sh/lit@3";

    const OCTAVE = [
      { note: "C", freq: 261.63, key: "a", slot: 0 },
      { note: "C♯", freq: 277.18, key: "w", slot: 1 },
      { note: "D", freq: 293.66, key: "s", slot: 0 },
      { note: "D♯", freq: 311.13, key: "e", slot: 2 },
      { note: "E", freq: 329.63, key: "d", slot: 0 },
      { note: "F", freq: 349.23, key: "f", slot: 0 },
      { note: "F♯", freq: 369.99, key: "t", slot: 4 },
      { note: "G", freq: 392, key: "g", slot: 0 },
      { note: "G♯", freq: 415.3, key: "y", slot: 5 },
      { note: "A", freq: 440, key: "h", slot: 0 },
      { note: "A♯", freq: 466.16, key: "u", slot: 6 },
      { note: "B", freq: 493.88, key: "j", slot: 0 },
    ];

    const naturals = OCTAVE.filter((tone) => tone.slot === 0);
    const sharps = OCTAVE.filter((tone) => tone.slot > 0);

    class GrandOctave extends LitElement {
      static styles = css`
        .bed {
          position: relative;
          height: 10rem;
          border-radius: 8px 8px 12px 12px;
          background: linear-gradient(180deg, #050506, #101014 12%);
          padding: 0.9rem 0.9rem 0;
          box-shadow: inset 0 1px 0 rgb(255 255 255 / 8%);
        }
        .naturals {
          position: relative;
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 2px;
          height: 100%;
        }
        button { appearance: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
        .natural {
          border-radius: 0 0 5px 5px;
          background: linear-gradient(180deg, #d9d2c2, var(--ivory) 8%, #cbc4b2 88%, #a49d8c);
          box-shadow: inset 0 -5px 8px rgb(0 0 0 / 18%);
        }
        .natural.down {
          background: linear-gradient(180deg, #b8b1a0, #cfc8b6 14%, #b3ac9a);
          box-shadow: inset 0 4px 9px rgb(0 0 0 / 32%);
          transform: translateY(1px);
        }
        .sharp {
          position: absolute;
          top: 0;
          width: 9%;
          height: 58%;
          margin-left: -4.5%;
          border-radius: 0 0 4px 4px;
          background: linear-gradient(180deg, #2b2b31, #0a0a0c 22%, #17171b 90%, #050506);
          box-shadow: inset 0 1px 0 rgb(255 255 255 / 22%), 0 6px 10px rgb(0 0 0 / 55%);
        }
        .sharp.down {
          background: linear-gradient(180deg, #1c1c21, #060607 30%);
          box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%);
          transform: translateY(1px);
        }
        .down { outline: 1px solid var(--brass-deep); }
        .readout {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 1rem;
          margin: 0.9rem 0 0;
          font-family: var(--font-utility);
          font-size: 0.75rem;
          color: var(--ivory-dim);
        }
        .renders { color: var(--brass-deep); font-variant-numeric: tabular-nums; }
        .readout b {
          font-family: var(--font-display);
          font-size: 1.5rem;
          font-weight: 400;
          color: var(--brass);
        }
      `;

      static properties = {
        pressed: { state: true },
        last: { state: true },
      };

      constructor() {
        super();
        this.pressed = new Set();
        this.last = undefined;
        this.audio = undefined;
        this.onKey = (event) => {
          if (event.repeat) return;
          const tone = OCTAVE.find((t) => t.key === event.key);
          if (!tone) return;
          if (event.type === "keydown") this.noteOn(tone);
          else this.noteOff(tone);
        };
      }

      noteOn(tone) {
        this.pressed = new Set([...this.pressed, tone.note]);
        this.last = tone;
        this.strike(tone.freq);
      }

      noteOff(tone) {
        this.pressed = new Set([...this.pressed].filter((note) => note !== tone.note));
      }

      strike(freq) {
        if (!("AudioContext" in globalThis)) return;
        this.audio ??= new AudioContext();
        void this.audio.resume();
        const now = this.audio.currentTime;
        const osc = new OscillatorNode(this.audio, { type: "triangle", frequency: freq });
        const envelope = new GainNode(this.audio, { gain: 0 });
        envelope.gain.linearRampToValueAtTime(0.22, now + 0.01);
        envelope.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
        osc.connect(envelope).connect(this.audio.destination);
        osc.start(now);
        osc.stop(now + 1.5);
      }

      keyFor(tone, kind) {
        const isDown = this.pressed.has(tone.note);
        return html`
          <button
            class="${kind} ${isDown ? "down" : ""}"
            style=${kind === "sharp" ? `left: calc(100% / 7 * ${String(tone.slot)})` : nothing}
            aria-label="${tone.note} (${tone.key})"
            aria-pressed=${isDown}
            @pointerdown=${() => { this.noteOn(tone); }}
            @pointerup=${() => { this.noteOff(tone); }}
            @pointerleave=${() => { this.noteOff(tone); }}
          ></button>
        `;
      }

      connectedCallback() {
        super.connectedCallback();
        globalThis.addEventListener("keydown", this.onKey);
        globalThis.addEventListener("keyup", this.onKey);
      }

      disconnectedCallback() {
        globalThis.removeEventListener("keydown", this.onKey);
        globalThis.removeEventListener("keyup", this.onKey);
        super.disconnectedCallback();
      }

      render() {
        this.renders = (this.renders ?? 0) + 1;
        return html`
          <div class="bed">
            <div class="naturals">
              ${naturals.map((tone) => this.keyFor(tone, "natural"))}
              ${sharps.map((tone) => this.keyFor(tone, "sharp"))}
            </div>
          </div>
          <p class="readout">
            <span>keys a–j play, w e t y u for sharps</span>
            <span class="renders" title="how many times render() has run">render() ×${this.renders}</span>
            <b>${this.last ? `${this.last.note} · ${String(this.last.freq)} Hz` : "-"}</b>
          </p>
        `;
      }
    }

    customElements.define("grand-octave", GrandOctave);
  </script>
</body>
</html>
